name: Efemérides de LaFerropedia

# Baja las efemérides de LaFerropedia (insumo de «Un día como hoy»). A mano, una vez por mes,
# o cuando cambia el script.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 2 * *"
  push:
    branches: [main]
    paths:
      - scripts/efemerides-laferropedia.mjs
      - .github/workflows/efemerides-laferropedia.yml

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bajar efemérides
        run: node scripts/efemerides-laferropedia.mjs
      - name: Guardar
        run: |
          git config user.name "ferro-en-numeros-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos-fuente/laferropedia/efemerides.json
          git commit -m "Efemérides de LaFerropedia" || exit 0
          git pull --rebase
          git push
